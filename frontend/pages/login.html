
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na conta | Achados e Perdidos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pagina-login">

    <header class="cabecalho">
        <div class="cabecalho-conteudo">
            <div class="marca">
                <span class="marca-icone">🔎</span>
                <div>
                    <h1>Achados e Perdidos</h1>
                    <p>IFPE — Campus Palmares</p>
                </div>
            </div>
        </div>
    </header>

    <main class="login-container">

        <span class="etiqueta">ACESSO AO SISTEMA</span>

        <h2>Bem-vindo de volta!</h2>

        <p>Entre com seus dados para acessar sua conta.</p>

        <form id="formLogin">

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="seuemail@exemplo.com"
                autocomplete="username"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="botao" id="botaoLogin">
                Entrar
            </button>

        </form>

        <p id="mensagemLogin" class="mensagem-login" role="alert"></p>

        <a href="../index.html" class="voltar-inicio">
            ← Voltar para a página inicial
        </a>

    </main>

    <script src="../js/api.js"></script>

    <script>
        const formulario = document.getElementById("formLogin");
        const mensagem = document.getElementById("mensagemLogin");
        const botao = document.getElementById("botaoLogin");

        formulario.addEventListener("submit", async function(event) {
            event.preventDefault();

            mensagem.textContent = "";
            botao.disabled = true;
            botao.textContent = "Entrando...";

            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;

            try {
                const resultado = await fazerLogin(email, senha);

                mensagem.textContent = "Login realizado com sucesso!";

                if (resultado.usuario.tipo === "admin") {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "../index.html";
                }

            } catch (erro) {
                mensagem.textContent = erro.message;
            } finally {
                botao.disabled = false;
                botao.textContent = "Entrar";
            }
        });
    </script>

</body>
</html>
