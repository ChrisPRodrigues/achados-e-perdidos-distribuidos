
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Detalhes do Objeto | Achados e Perdidos
    </title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Achados e Perdidos</h1>
    </header>

    <main>
        <section>

            <h2>Detalhes do Objeto</h2>

            <!-- Informações do objeto -->
            <div id="detalhesObjeto">
                <p>Carregando informações...</p>
            </div>

            <!-- Formulário de devolução -->
            <div id="secaoDevolucao" class="oculto">

                <h3>Solicitar Devolução</h3>

                <form id="formDevolucao">

                    <!-- Nome -->
                    <label for="nomeSolicitante">
                        Seu nome:
                    </label>

                    <input
                        type="text"
                        id="nomeSolicitante"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                    <!-- E-mail -->
                    <label for="emailSolicitante">
                        Seu e-mail:
                    </label>

                    <input
                        type="email"
                        id="emailSolicitante"
                        name="email"
                        placeholder="exemplo@email.com"
                        required
                    >

                    <!-- Justificativa -->
                    <label for="comprovacao">
                        Como podemos identificar que o
                        objeto pertence a você?
                    </label>

                    <textarea
                        id="comprovacao"
                        name="comprovacao"
                        rows="4"
                        placeholder="Descreva características do objeto que comprovem que ele pertence a você."
                        required
                    ></textarea>

                    <!-- Enviar -->
                    <button type="submit">
                        Enviar Solicitação
                    </button>

                </form>
            </div>

            <!-- Voltar -->
            <a href="../index.html" class="botao">
                Voltar à página inicial
            </a>

        </section>
    </main>

    <script src="../js/detalhes.js"></script>

</body>
</html>
